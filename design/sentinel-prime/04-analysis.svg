<text x="18" y="301" class="t" font-size="13" font-weight="700">Why this verdict?</text><text x="357" y="301" class="m" font-size="10" text-anchor="end">Illustrative evidence</text><g font-size="10"><circle cx="28" cy="320" r="6" fill="#20232A"/><path d="m25 320 2 2 4-4" fill="none" stroke="#F5A524" stroke-width="1.1"/><text x="41" y="323" class="b">Trend and mean-reversion views disagree.</text><circle cx="28" cy="339" r="6" fill="#20232A"/><path d="m25 339 2 2 4-4" fill="none" stroke="#F5A524" stroke-width="1.1"/><text x="41" y="342" class="b">Momentum is neutral; confirmation is missing.</text><circle cx="28" cy="358" r="6" fill="#20232A"/><path d="m25 358 2 2 4-4" fill="none" stroke="#F5A524" stroke-width="1.1"/><text x="41" y="361" class="b">Market data and news are not verified.</text></g>
