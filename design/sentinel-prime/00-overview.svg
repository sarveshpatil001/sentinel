<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" role="img" aria-labelledby="title desc"><title id="title">Sentinel Prime — Complete Mobile UI Design Overview</title><desc id="desc">A coordinated six-screen high-fidelity mobile design system for a transparent, analysis-only forex companion. Each screen thumbnail links to an individually inspectable SVG in this folder.</desc><defs><style>text{font-family:Inter,'DM Sans',Arial,sans-serif}.bg{fill:#070C15}.s{fill:#0B1320;stroke:#1A2A3E;stroke-width:1}.e{fill:#0E1827;stroke:#263950;stroke-width:1}.t{fill:#F4F7FB}.b{fill:#9FB1C7}.m{fill:#718198}.teal{fill:#00D2B4}.blue{fill:#38BDF8}.amber{fill:#F5A524}</style></defs><rect class="bg" width="1440" height="1510"/><g transform="translate(70 45)"><path d="M18 2 34 8v12c0 10-7.2 17-16 21C9.2 37 2 30 2 20V8L18 2Z" fill="#0E1827" stroke="#00D2B4" stroke-width="2"/><path d="m10 21 5 5 11-13" fill="none" stroke="#00D2B4" stroke-width="2.5"/><text x="48" y="19" class="t" font-size="24" font-weight="750" letter-spacing="-.5">Sentinel Prime</text><rect x="242" y="1" width="112" height="26" rx="13" fill="#14251F" stroke="#235446"/><circle cx="257" cy="14" r="3.5" fill="#10B981"/><text x="267" y="18" fill="#9CE8D2" font-size="10" font-weight="700" letter-spacing=".8">DEMO MODE</text></g><text x="70" y="130" class="t" font-size="35" font-weight="750" letter-spacing="-1">Forex intelligence, without the noise.</text><text x="70" y="161" class="b" font-size="15">A complete six-screen mobile concept · 375 × 812 reference · analysis-only prototype</text><rect x="1083" y="94" width="287" height="79" rx="12" fill="#0E1827" stroke="#263950"/><text x="1101" y="119" class="amber" font-size="11" font-weight="750" letter-spacing=".6">SAFETY FIRST</text><text x="1101" y="141" class="t" font-size="13" font-weight="650">Execution locked · no broker connection</text><text x="1101" y="159" class="m" font-size="10">Every quote and insight is illustrative.</text>
